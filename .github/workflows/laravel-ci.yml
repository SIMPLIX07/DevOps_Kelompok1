name: Laravel CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  laravel-ci:
    name: Run Tests & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup PHP 8.2 & ekstensi pendukung
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip
          coverage: none

      # 3. Setup Node.js untuk build frontend (Vite)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Cache dependency Composer agar build lebih cepat
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      # 5. Install Dependency PHP (Composer)
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # 6. Install Dependency NPM & Build Asset Frontend
      - name: Install NPM & Build Vite Assets
        run: |
          npm ci
          npm run build

      # 7. Siapkan Environment Laravel (.env) & App Key
      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      # 8. Jalankan Unit/Feature Testing (PHPUnit) dengan Database SQLite Memory
      - name: Run Test Suite (PHPUnit)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

