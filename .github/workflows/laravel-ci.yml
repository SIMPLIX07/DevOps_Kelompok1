name: Laravel CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  laravel-ci:
    name: Run Tests, Coverage & SonarQube
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository (fetch-depth: 0 wajib untuk SonarCloud)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup PHP 8.2 & PCOV (agar bisa generate code coverage dengan cepat)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip
          coverage: pcov

      # 3. Setup Node.js untuk build frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Cache dependency Composer
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      # 5. Install Dependency PHP
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # 6. Install Dependency NPM & Build Vite Assets
      - name: Install NPM & Build Vite Assets
        run: |
          npm ci
          npm run build

      # 7. Siapkan Environment Laravel (.env) & App Key
      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      # 8. JALANKAN UNIT & FEATURE TEST (dengan export coverage.xml)
      - name: Run Unit & Feature Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --coverage-clover=coverage.xml

      # 9. SCAN SONARCLOUD / SONARQUBE
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=SIMPLIX07_a
            -Dsonar.organization=simplix07
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=vendor/**,node_modules/**,storage/**,public/**
